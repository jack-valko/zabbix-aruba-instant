              description: 'Total bytes transmitted by the client'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 355bb1ab675a463a92f204663e989ead
              name: 'Client Tx Data Frames[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.8.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.tx.frames[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
              units: fps
              description: 'Total frames transmitted by the client per second'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: e263640a7d82445081d0ac74227a5289
              name: 'Client Tx Rate[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.11.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.tx.rate[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              trends: '0'
              description: 'Transmit rate of client in mbps'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 8057b77f3ad2421b94c9d9574432d8dd
              name: 'Client Tx Retries[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.10.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.tx.retries[{#SNMPINDEX}]'
              delay: 5m
