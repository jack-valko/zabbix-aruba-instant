              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.15.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.rx.rate[{#SNMPINDEX}]'
              delay: 1h
