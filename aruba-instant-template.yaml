              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.6.{#SNMPINDEX}'
              key: 'aruba.instant.client.os[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              value_type: TEXT
              description: 'Client operating system'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 21a85fc9798242668af82c9e71dac816
              name: 'Client PHY Type[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.17.{#SNMPINDEX}'
              key: 'aruba.instant.client.phytype[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              trends: '0'
              description: 'The wireless PHY type to which the client is associated, or ''wired'''
              valuemap:
                name: 'Client PHY Type'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 002eba162c99496a8ab7283dc5ae959b
              name: 'Client SNR[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.7.{#SNMPINDEX}'
              key: 'aruba.instant.client.snr[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
              units: dB
              description: 'Signal to noise ratio of client connection to the access point'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 7b2410fcb10044f2ae3a7a57447bb526
              name: 'Client Uptime[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.16.{#SNMPINDEX}'
              key: 'aruba.instant.client.uptime[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              trends: '0'
              units: uptime
              description: |
                Client uptime. 
                On mobility event all counters are reset to 0 and uptime gets reset to 0.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
          master_item:
            key: aruba.instant.walk.clients
        - uuid: 1ac1cef3f8794e1fbb8ebd65ec4277bf
          name: 'Virtual Controller'
          type: DEPENDENT
          key: aruba.instant.controller.disco
          lifetime: 4d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Virtual controller discovery'
          item_prototypes:
            - uuid: bc4b1f6435a841b6b6de79c885d322e9
              name: 'Virtual Controller Group IP'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.1.16.{#SNMPINDEX}'
              key: 'aruba.instant.controller.ipaddr[{#SNMPINDEX}]'
              history: 1w
              value_type: CHAR
              description: 'Virtual controller group IP'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Virtual Controller'
              trigger_prototypes:
                - uuid: 798dcf7232a440b0b9c97fe846278889
                  expression: 'last(/Aruba Instant by SNMP/aruba.instant.controller.ipaddr[{#SNMPINDEX}])<>last(/Aruba Instant by SNMP/aruba.instant.controller.ipaddr[{#SNMPINDEX}], #2)'
                  recovery_mode: NONE
                  name: 'Virtual Controller Changed'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: AVERAGE
                  description: 'Virtual controller IP has changed.  Manual close required.'
                  manual_close: 'YES'
            - uuid: ac2af1313d66453490b81ca6c9290e1c
              name: 'Virtual Controller Key'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.1.1.{#SNMPINDEX}'
              key: 'aruba.instant.controller.key[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              value_type: CHAR
              description: 'Virtual controller key'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Virtual Controller'
            - uuid: fab639ae5c814f408aa07c86372123ed
              name: 'Virtual Controller Name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.1.2.{#SNMPINDEX}'
              key: 'aruba.instant.controller.name[{#SNMPINDEX}]'
              delay: 15m
              history: 1w
              value_type: CHAR
              description: 'Virtual controller name'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Virtual Controller'
            - uuid: 83a43503bdb243039835fa729689596e
              name: 'Virtual Controller Organization'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.1.3.{#SNMPINDEX}'
              key: 'aruba.instant.controller.org[{#SNMPINDEX}]'
              delay: 1h
              history: 1w
              value_type: CHAR
              description: 'Virtual controller organization'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Virtual Controller'
            - uuid: 5364ef1a76a14f6a8f591bbfec442e2b
              name: 'Virtual Controller Version'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.1.4.{#SNMPINDEX}'
              key: 'aruba.instant.controller.version[{#SNMPINDEX}]'
              delay: 15m
              history: 1w
              value_type: CHAR
              description: 'Virtual controller version string'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Virtual Controller'
              trigger_prototypes:
                - uuid: e9f5312d0f3e407ca9b828a0d5688f3c
                  expression: 'last(/Aruba Instant by SNMP/aruba.instant.controller.version[{#SNMPINDEX}])<>last(/Aruba Instant by SNMP/aruba.instant.controller.version[{#SNMPINDEX}], #2)'
                  recovery_mode: NONE
                  name: 'Firmware Version Changed'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: AVERAGE
                  description: 'Firmware version has changed.  Manual close required.'
                  manual_close: 'YES'
          master_item:
            key: aruba.instant.walk.controller
        - uuid: 14c0135be5d64ce8bb22a147e996164c
          name: 'Aruba Instant Device Table'
          type: DEPENDENT
          key: aruba.instant.device.disco
          lifetime: 4d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'This contains all access points connected to the virtual controller.'
          item_prototypes:
            - uuid: f87a1ac2fd2048388177e9ed166bada3
              name: '{#AIAPNAME} CPU Utilization'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.1.1.7.{#SNMPINDEX}'
              key: 'aruba.instant.device.cpu[{#SNMPINDEX}]'
              delay: 5m
              units: '%'
              description: 'Access Point CPU Utilization'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Device Table'
              trigger_prototypes:
                - uuid: 74f5f4c7c8ea4be6ababdcbffea14e94
                  expression: |
                    last(/Aruba Instant by SNMP/aruba.instant.device.cpu[{#SNMPINDEX}],#3)>={$DEVICE_CPU_WARN} and
                    last(/Aruba Instant by SNMP/aruba.instant.device.cpu[{#SNMPINDEX}],#3)< {$DEVICE_CPU_ERROR}
                  name: '{#AIAPNAME} CPU Elevated'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: WARNING
                - uuid: 3931c53f8ede4cc09ab0d6711521149c
                  expression: 'last(/Aruba Instant by SNMP/aruba.instant.device.cpu[{#SNMPINDEX}],#3)>= {$DEVICE_CPU_ERROR}'
                  name: '{#AIAPNAME} CPU Error'
                  opdata: '{ITEM.LASTVALUE}'
                  priority: AVERAGE
            - uuid: 6685a8ccb1f64bf9a45334fd9f8d811a
              name: '{#AIAPNAME} HW Opmode'
