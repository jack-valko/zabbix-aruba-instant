                - tag: component
                  value: 'Client Table'
            - uuid: 75733bfc44ff43aa9134e4fa614a4d3d
              name: 'Client Name[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.5.{#SNMPINDEX}'
              key: 'aruba.instant.client.name[{#SNMPINDEX}]'
              delay: 15m
              history: 1w
              value_type: TEXT
              description: 'Name of client device'
              preprocessing:
                - type: REGEX
                  parameters:
                    - (\S+)
                    - \1
                  error_handler: CUSTOM_VALUE
                  error_handler_params: Unknown
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: ebc1e2a54c344034bd4d44b85cabc2b1
