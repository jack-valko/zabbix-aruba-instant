              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.13.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.rx.bytes[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
              units: B
              description: 'Total bytes received by the client per second'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 4917f1823179478494404bd63dbd77dd
              name: 'Client Rx Data Frames[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.12.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.rx.frames[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
              units: fps
              description: 'Total frames received by the client per second'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: adc9b0f1250e49aab7ad3ad14b68c0e7
