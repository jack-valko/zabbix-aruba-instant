                - tag: component
                  value: 'Client Table'
            - uuid: 2e53aa29d85548f1ba70d3c65d4295b8
              name: 'Client Rx Retries[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.14.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.rx.retries[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
              units: fps
              description: 'Total number of retry frames received by the client per second'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: 5a4f6989514f4eaaa27f3aca753ed2a5
              name: 'Client Tx Data Bytes[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.9.{#SNMPINDEX}'
              key: 'aruba.instant.client.data.tx.bytes[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: FLOAT
              trends: '0'
