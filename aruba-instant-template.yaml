zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 148aaf582e3c4341b5c2dadedaf226e3
      template: 'Aruba Instant by SNMP'
      name: 'Aruba Instant by SNMP'
      description: |
        Initial template created By Sean Bradley's SNMP2ZABBIX.py at 
        https://github.com/Sean-Bradley/SNMP2ZABBIX
        
        Significantly modified by jack@valko.org
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 54272dce16fe4d90a88bd198b1e6943a
          name: Clients
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.3]'
          key: aruba.instant.walk.clients
          history: 14d
          value_type: TEXT
          description: 'Walk of client OIDs'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#APCLIENTIP}'
                - .1.3.6.1.4.1.14823.2.3.3.1.2.4.1.3
                - '0'
          tags:
            - tag: Application
              value: 'Aruba Instant'
            - tag: component
              value: 'Client Table'
        - uuid: 85f98ed6c9bb459db21bef49ace27596
          name: Controller
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.14823.2.3.3.1.1.1,.1.3.6.1.4.1.14823.2.3.3.1.1.2,.1.3.6.1.4.1.14823.2.3.3.1.1.3,.1.3.6.1.4.1.14823.2.3.3.1.1.4,.1.3.6.1.4.1.14823.2.3.3.1.1.5,.1.3.6.1.4.1.14823.2.3.3.1.1.16]'
          key: aruba.instant.walk.controller
          delay: 30m
          history: 14d
          value_type: TEXT
          description: 'Walk of virtual controller OIDs'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#APCTRLKEY}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.1
                - '0'
                - '{#APCTRLNAME}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.2
                - '0'
                - '{#APCTRLORG}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.3
                - '0'
                - '{#APCTRLVER}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.4
                - '0'
                - '{#APCTRLGRP}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.16
                - '0'
          tags:
            - tag: Application
              value: 'Aruba Instant'
            - tag: component
              value: 'Virtual Controller'
        - uuid: 4c0be111188044d2894eae260d011587
          name: Devices
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.14823.2.3.3.1.2.1.1.2]'
          key: aruba.instant.walk.devices
          delay: 30m
          history: 14d
          value_type: TEXT
          description: 'Walk of AP devices'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#AIAPNAME}'
                - .1.3.6.1.4.1.14823.2.3.3.1.2.1.1.2
                - '0'
          tags:
            - tag: Application
              value: 'Aruba Instant'
            - tag: component
              value: 'Device Table'
        - uuid: 9f7331273650436f9266b3b388cd2a34
          name: Radios
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.14823.2.3.3.1.2.1.1.2,.1.3.6.1.4.1.14823.2.3.3.1.2.2.1.2]'
          key: aruba.instant.walk.radios
          delay: 30m
          history: 14d
          value_type: TEXT
          description: 'Walk of radio OIDs'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  // Split into array rows
                  var rows = value.split('\n');
                  
                  // Create empty arrays and objects
                  var output = [ ];
                  var ap_index = {};
                  var radio_index = {};
                  var output_row = 0;
                  
                  // Is this an AP?
                  for (var i = 0; i < rows.length; i++) {
                      var row = rows[i].match(/^\.1\.3\.6\.1\.4\.1\.14823\.2\.3\.3\.1\.2\.1\.1\.2\.([\d\.]+)\s+=\s+STRING:\s+(\S+)/);
                      if (row !== null) {
                          ap_index[row[1]] = row[2];
                      }
                  }
                  
                  // Count the radios
                  for (var j = 0; j < rows.length; j++) {
                      var row = rows[j].match(/^\.1\.3\.6\.1\.4\.1\.14823\.2\.3\.3\.1\.2\.2\.1\.2\.([\d\.]+)\s+=\s+INTEGER:\s+(\d+)/);
                      if (row !== null) {
                          // add this radio to the output array
                          output[output_row++] = row[0]
                          
                          // create an index value that matches the AP
                          row[1] = row[1].replace(/\.\d+$/, "");
                          radio_index[row[1]] = row[2];
                      }
                  }
                  
                  // Add the APs to output with radio index expansion
                  for (var k in ap_index) {
                      for (var i = 0; i <= radio_index[k]; i++) {
                          output[output_row++] = ".1.3.6.1.4.1.14823.2.3.3.1.2.1.1.2." + k + "." + i + " = STRING: " + ap_index[k];
                      }
                  }
                  
                  // output
                  return (output.join('\n'));
          tags:
            - tag: Application
              value: 'Aruba Instant'
            - tag: component
              value: 'Radio Table'
        - uuid: 76094628c07f42878211a1b1e9db85da
          name: Wlans
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.14823.2.3.3.1.1.7.1.2]'
          key: aruba.instant.walk.wlans
          delay: 30m
          history: 14d
          value_type: TEXT
          description: 'Walk of SSIDs'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#APSSID}'
                - .1.3.6.1.4.1.14823.2.3.3.1.1.7.1.2
                - '0'
          tags:
            - tag: Application
              value: 'Aruba Instant'
            - tag: component
              value: 'SSID Table'
      discovery_rules:
        - uuid: 0b133a608577438c82e8b719cb90bc56
          name: 'Aruba Instant Client Discovery'
          type: DEPENDENT
          key: aruba.instant.client.disco
          lifetime: 1d
          description: 'This table contains information about all clients connected to the virtual controller. When a client roams from one access point to another, all counters in this table are reset to 0. aiClientUptime also get reset on a mobility event'
          item_prototypes:
            - uuid: c26dae32ffd5486ba4ff6e2c803df6be
              name: 'Client AP IP Address[{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.14823.2.3.3.1.2.4.1.4.{#SNMPINDEX}'
              key: 'aruba.instant.client.ap.ipaddr[{#SNMPINDEX}]'
              delay: 5m
              history: 1w
              value_type: TEXT
              description: 'Associated Access Point IP Address'
              tags:
                - tag: Application
                  value: 'Aruba Instant'
                - tag: component
                  value: 'Client Table'
            - uuid: aacaa12cef494ff0a4ac1514e0c78180
